[project]
name = "substream"
version = "1.0.0"
description = "Good Memory has ECC: evaluating the memory of vision-language models beyond accuracy"
readme = "README.md"
requires-python = ">=3.10,<3.12"

# The base install is intentionally small: enough to download the dataset and
# run the CPU test suite. Evaluating models needs an extra: `api` for hosted
# models (Claude, OpenRouter), or one of the mutually exclusive GPU stacks
# below (the evaluated models require conflicting transformers versions).
dependencies = [
  "huggingface-hub>=0.24",
  "numpy",
]

[project.scripts]
substream-eval = "substream.eval.runner:main"

[project.optional-dependencies]
# API-backed subject models (Claude, and any OpenRouter-served model). The
# evaluation runner also needs torch, pillow, and opencv for its shared video
# plumbing, even though API models run no local inference.
api = [
  "anthropic",
  "openai",
  "torch",
  "pillow",
  "opencv-python-headless",
]

dev = [
  "pytest>=8",
  "ruff",
]

# Training and evaluating the small alternative-architecture backbones
# (substream.backbones). Pins follow the environment the published backbone
# results were trained in.
backbones = [
  # torch 2.9 is the last CUDA 12.x generation, matching the prebuilt
  # flash-attn wheel below and the kernels' source builds.
  "torch>=2.3.1,<2.10",
  "pytorch-lightning>=2.4.0",
  "transformers>=4.40,<5.0",
  "tokenizers",
  "mamba-ssm[causal-conv1d]==2.3.1",
  "causal-conv1d==1.6.1",
  "flash-linear-attention",
  "titans-pytorch>=0.4.23",
  "dnc",
  "safetensors",
  "einops",
  "pillow",
  "numpy",
  "wandb",
  "tensorboard",
  "pytest>=8",
  "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.4.17/flash_attn-2.8.3+cu128torch2.9-cp311-cp311-linux_x86_64.whl",
]

# GPU environments. Each extra pins the exact library stack one group of
# models requires; see docs/ENVIRONMENTS.md for the model-to-extra table.
# The pins are load-bearing: these stacks reproduce the published results.
hf448 = [
  "torch==2.6.0",
  "transformers==4.48.2",
  "accelerate==1.4.0",
  "soundfile==0.13.1",
  "pillow==11.1.0",
  "scipy==1.15.2",
  "torchvision==0.21.0",
  "backoff==2.2.1",
  "peft==0.14.0",
  "datasets==3.3.2",
  "pandas==2.2.3",
  "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.0.8/flash_attn-2.7.4.post1+cu124torch2.6-cp311-cp311-linux_x86_64.whl",
  "evaluate==0.4.3",
  "sacrebleu==2.5.1",
  "qwen-vl-utils",
]

hf450 = [
  "transformers==4.50.0",
  "accelerate==1.5.2",
  "qwen-vl-utils[decord]==0.0.10",
  "six>=1.17.0",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.4.17/flash_attn-2.8.3+cu128torch2.9-cp311-cp311-linux_x86_64.whl",
]

hf451 = [
  "setuptools-scm",
  "torchdiffeq",
  "resampy",
  "x-transformers",
  "accelerate==0.34.2",
  "ninja",
  "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.0.8/flash_attn-2.7.4.post1+cu124torch2.6-cp311-cp311-linux_x86_64.whl",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "torchaudio==2.6.0",
  "peft==0.15.2",
  "moviepy==2.1.2",
  "httpx==0.23.0",
  "pydub==0.25.1",
  "trl==0.16.0",
  "onnxruntime-gpu",
  "insightface==0.7.3",
  "hdbscan==0.8.40",
  "transformers==4.52",
  "vllm==0.8.4",
  "numpy",
]

full-stack = [
  "transformers @ git+https://github.com/huggingface/transformers@f028e9340cca466a64592dbea542d3bdd2c89d5e",
  "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.4.11/flash_attn-2.8.3+cu128torch2.8-cp311-cp311-linux_x86_64.whl",
  "vllm>=0.10.2",
  "qwen-vl-utils>=0.0.14",
  "huggingface-hub",
  "hdbscan",
  "xgrammar>=0.1.25",
  "s2wrapper @ git+https://github.com/bfshi/scaling_on_scales",
]

[tool.uv]
default-groups = []

# The GPU extras pin incompatible transformers versions, so uv must never try
# to satisfy two of them in one environment.
conflicts = [
  [{ extra = "backbones" }, { extra = "hf448" }],
  [{ extra = "backbones" }, { extra = "hf450" }],
  [{ extra = "backbones" }, { extra = "hf451" }],
  [{ extra = "backbones" }, { extra = "full-stack" }],
  [{ extra = "hf448" }, { extra = "hf450" }],
  [{ extra = "hf448" }, { extra = "hf451" }],
  [{ extra = "hf448" }, { extra = "full-stack" }],
  [{ extra = "hf450" }, { extra = "hf451" }],
  [{ extra = "hf450" }, { extra = "full-stack" }],
  [{ extra = "hf451" }, { extra = "full-stack" }],
]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "S102", "TID252"]
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a GPU and a model environment; excluded from the default run",
]
addopts = "-m 'not gpu'"
